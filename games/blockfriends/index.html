<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#BDE9FF">
<meta name="description" content="초등학교 1학년을 위한 마인크래프트 스타일 귀여운 모험 게임">
<title>블록 친구들의 모험</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root{
    /* 밝은 블록 세계에서 뽑은 색 */
    --grass:#7BC24A;
    --grass-d:#5EA033;
    --wood:#D3A469;
    --wood-l:#EBC895;
    --wood-d:#9A7040;
    --bark:#4A3320;
    --sky:#9BDCFF;
    --cream:#FFF6E4;
    /* 신호색 */
    --heart:#FF5C6E;
    --gem:#4FE3D9;
    --gold:#FFC93C;
    --leaf:#4FA83A;
    --candy:#FF9EC4;

    --font: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "맑은 고딕",
            "Malgun Gothic", system-ui, sans-serif;
  }

  html { -webkit-text-size-adjust: 100%; }

  body{
    font-family: var(--font);
    color: var(--bark);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    background: var(--sky);
    background-image:
      linear-gradient(180deg, #BDE9FF 0%, #D5F0FF 45%, #E4F6DC 78%, #C7E9A8 100%),
      repeating-linear-gradient(90deg, rgba(255,255,255,.10) 0 32px, rgba(0,0,0,.05) 32px 64px);
    background-attachment: fixed;
  }

  #app{
    width: 100%;
    max-width: 520px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 10px;
    background: rgba(255, 255, 255, .30);
  }

  /* ── 나무판자 베벨 (각진 블록 UI) ─────────────────── */
  .bevel{
    background: var(--wood);
    border-top: 4px solid var(--wood-l);
    border-left: 4px solid var(--wood-l);
    border-right: 4px solid var(--wood-d);
    border-bottom: 4px solid var(--wood-d);
  }

  /* ── 상단 상태 ────────────────────────────────────── */
  header{
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px;
  }
  .row{ display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .row.between{ justify-content: space-between; }

  #hearts{ display: flex; gap: 3px; }
  .heart{ width: 24px; height: 24px; }

  .stat{
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 20px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    color: #3E2A18;
    text-shadow: 1px 1px 0 rgba(255,255,255,.55);
  }
  .stat .cap{
    font-size: 13px; font-weight: 800; letter-spacing: .08em;
    background: rgba(255,255,255,.45);
    padding: 3px 7px;
  }

  #stagebar{ display: flex; gap: 3px; width: 100%; }
  #stagebar i{
    flex: 1 1 0; height: 10px;
    background: rgba(74,51,32,.28);
  }
  #stagebar i.on{ background: var(--leaf); }
  #stagebar i.now{ background: var(--gold); box-shadow: 0 0 0 2px rgba(255,255,255,.6) inset; }

  /* ── 무대 ─────────────────────────────────────────── */
  #stage{ position: relative; padding: 0; overflow: hidden; }
  #scene{
    display: block;
    width: 100%;
    height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: manipulation;
  }

  /* ── 말풍선 ───────────────────────────────────────── */
  #say{
    padding: 16px 14px;
    background: var(--cream);
    border-top: 4px solid #FFFFFF;
    border-left: 4px solid #FFFFFF;
    border-right: 4px solid #D8C39C;
    border-bottom: 4px solid #D8C39C;
    font-size: 25px;
    font-weight: 900;
    line-height: 1.45;
    text-align: center;
    text-wrap: balance;
    word-break: keep-all;
    overflow-wrap: break-word;
    min-height: 96px;
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #4A3320;
  }
  #say small{ display: block; font-size: 17px; font-weight: 800; color: #8A6B45; margin-top: 6px; }

  /* ── 버튼 ─────────────────────────────────────────── */
  #acts{
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-bottom: 6px;
  }
  button{
    font-family: inherit;
    word-break: keep-all;
    font-size: 28px;
    font-weight: 900;
    color: #FFFFFF;
    padding: 18px 14px;
    cursor: pointer;
    text-shadow: 2px 2px 0 rgba(0,0,0,.28);
    background: var(--wood);
    border-top: 5px solid rgba(255,255,255,.55);
    border-left: 5px solid rgba(255,255,255,.55);
    border-right: 5px solid rgba(0,0,0,.22);
    border-bottom: 5px solid rgba(0,0,0,.22);
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  button:hover{ filter: brightness(1.08); }
  button:active{
    border-top-color: rgba(0,0,0,.22);
    border-left-color: rgba(0,0,0,.22);
    border-right-color: rgba(255,255,255,.55);
    border-bottom-color: rgba(255,255,255,.55);
    filter: brightness(.95);
  }
  button:focus-visible{ outline: 4px solid var(--gold); outline-offset: 3px; }
  button:disabled{ opacity: .42; cursor: default; filter: none; }

  button.go{ background: var(--leaf); }
  button.hit{ background: var(--candy); }
  button.eat{ background: var(--gold); color: #4A3320; text-shadow: 1px 1px 0 rgba(255,255,255,.5); }
  button.small{ font-size: 18px; padding: 11px 8px; }

  #tools{ display: flex; gap: 8px; }
  #tools button{ flex: 1 1 0; background: var(--wood-d); }
  #tools button[aria-pressed="false"]{ opacity: .48; }

  /* ── 애니메이션 ───────────────────────────────────── */
  @keyframes pop { 0%{transform:scale(1);} 40%{transform:scale(1.05);} 100%{transform:scale(1);} }
  .pop{ animation: pop .3s ease-out; }

  @keyframes wob {
    0%,100%{ transform: translateX(0) rotate(0); }
    30%{ transform: translateX(-5px) rotate(-1deg); }
    70%{ transform: translateX(5px) rotate(1deg); }
  }
  .wob{ animation: wob .34s ease-in-out; }

  @keyframes glow { 0%,100%{opacity:0;} 35%{opacity:.5;} }
  #flash{
    position: absolute; inset: 0;
    background: #FFFFFF;
    opacity: 0;
    pointer-events: none;
  }
  #flash.on{ animation: glow .3s ease-out; }

  @media (prefers-reduced-motion: reduce){
    .pop, .wob, #flash.on{ animation: none !important; }
  }

  @media (max-width: 380px){
    button{ font-size: 24px; padding: 15px 10px; }
    #say{ font-size: 21px; }
    .stat{ font-size: 18px; }
  }
</style>
</head>
<body>


<div id="app">
  <header class="bevel">
    <div class="row between">
      <div id="hearts" aria-label="하트"></div>
      <div class="stat"><span class="cap">보석</span><span id="gemN">0</span></div>
    </div>
    <div class="row between">
      <div class="stat"><span class="cap">무기</span><span id="wepN">나무 막대</span></div>
      <div class="stat"><span class="cap">밥</span><span id="foodN">0</span></div>
      <div class="stat"><span class="cap">친구</span><span id="frdN">0</span></div>
    </div>
    <div id="stagebar" aria-hidden="true"></div>
  </header>

  <div id="stage" class="bevel">
    <canvas id="scene" width="480" height="380" role="img" aria-label="모험 화면"></canvas>
    <div id="flash"></div>
  </div>

  <div id="say" role="status" aria-live="polite">준비 중...</div>

  <div id="acts"></div>

  <div id="tools">
    <button class="small" id="btnVoice" aria-pressed="true">🔊 읽어주기</button>
    <button class="small" id="btnSound" aria-pressed="true">🎵 소리</button>
    <button class="small" id="btnReset">↩️ 처음부터</button>
  </div>
</div>

    /* 아기 여우 */
    fox: { pal:{a:"#FFA857",f:"#FFF3E2",b:"#6B3A18",w:"#FFFFFF",p:"#FFB3C4"}, rows:[
      "aa........aa",
      "aaaaaaaaaaaa",

      "aawbaaaawbaa",

    /* 웃는 꼬마 크리퍼 */
    creeper: { pal:{a:"#8FD65C",b:"#3E6B2A",w:"#FFFFFF",p:"#FFB3C4"}, rows:[

    /* 무지개 드래곤 (친구 대장) */
    dragon: { pal:{a:"#C79BF7",b:"#4A2A6B",w:"#FFFFFF",p:"#FFB3C4",h:"#FFD54A",m:"#FF8FB1"}, rows:[
      "h............h",

    /* 손에 든 검 */
    sword: { pal:{a:"#C99A5B",b:"#EDEDED",c:"#8A6534",g:"#FFD54A"}, rows:[
      "......bb",
      ".....bbb",
      "....bbb.",
      "...bbb..",
      "..bbb...",
      "cabb....",
      "acb.....",
      "aa......"] }
  };

  function drawSprite(g, name, x, y, s, white){
    const sp = SPR[name];
    if (!sp) return;
    for (let r = 0; r < sp.rows.length; r++){
      const row = sp.rows[r];
      for (let c = 0; c < row.length; c++){
        const col = sp.pal[row[c]];
        if (!col) continue;
        g.fillStyle = col;
        g.fillRect(x + c * s, y + r * s, s, s);
      }
    }
    if (white){
      g.globalAlpha = .5;
      g.fillStyle = "#FFFFFF";
      g.fillRect(x, y, sp.rows[0].length * s, sp.rows.length * s);
      g.globalAlpha = 1;
    }
  }

  /* 블록 텍스처는 즉석 생성 */
  function drawBlock(g, x, y, size, base, spotColor, seed){
    g.fillStyle = base;
    g.fillRect(x, y, size, size);
    const u = size / 8;
    let s = seed;
    const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
    for (let i = 0; i < 20; i++){
      const px = Math.floor(rnd() * 8), py = Math.floor(rnd() * 8);
      g.fillStyle = rnd() > .5 ? "rgba(0,0,0,.12)" : "rgba(255,255,255,.18)";
      g.fillRect(x + px * u, y + py * u, u, u);
    }
    if (spotColor){
      for (let i = 0; i < 5; i++){
        const px = 1 + Math.floor(rnd() * 6), py = 1 + Math.floor(rnd() * 6);
        g.fillStyle = spotColor;
        g.fillRect(x + px * u, y + py * u, u, u);
        g.fillStyle = "rgba(255,255,255,.45)";
        g.fillRect(x + px * u, y + py * u, u / 2, u / 2);
      }
    }
    g.fillStyle = "rgba(255,255,255,.3)"; g.fillRect(x, y, size, u * .7);
    g.fillStyle = "rgba(0,0,0,.16)";      g.fillRect(x, y + size - u * .7, size, u * .7);
  }

  /* ══════════════════════════════════════════════════
     2. 소리 (부드러운 합성음) · 읽어주기
     ══════════════════════════════════════════════════ */
  let AC = null;
  const cfg = { sound: true, voice: true };

  function beep(freq, dur, type, vol){
    if (!cfg.sound) return;
    try{
      if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state === "suspended") AC.resume();
      const o = AC.createOscillator(), gn = AC.createGain();
      o.type = type || "sine";
      o.frequency.value = freq;
      gn.gain.setValueAtTime(vol || .07, AC.currentTime);
      gn.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + dur);
      o.connect(gn); gn.connect(AC.destination);
      o.start(); o.stop(AC.currentTime + dur);
    }catch(e){ /* 소리가 없어도 게임은 잘 돌아간다 */ }
  }
  const SFX = {
    tap:   () => { beep(720, .09, "sine", .07); setTimeout(() => beep(900, .08, "sine", .05), 55); },
    great: () => { [780, 990, 1240].forEach((f, i) => setTimeout(() => beep(f, .1, "triangle", .07), i * 55)); },
    bump:  () => { beep(300, .13, "sine", .06); },
    mine:  () => { beep(400 + Math.random() * 120, .07, "triangle", .06); },
    gem:   () => { [660, 880, 1180, 1480].forEach((f, i) => setTimeout(() => beep(f, .11, "triangle", .07), i * 65)); },
    win:   () => { [523, 659, 784, 1046, 1319].forEach((f, i) => setTimeout(() => beep(f, .16, "triangle", .08), i * 105)); },
    up:    () => { [523, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, .13, "triangle", .07), i * 85)); },
    eat:   () => { beep(420, .1, "sine", .07); setTimeout(() => beep(560, .12, "sine", .06), 95); }
  };

  function speak(text){
    if (!cfg.voice || !("speechSynthesis" in window)) return;
    try{
      speechSynthesis.cancel();
      const clean = text.replace(/[^가-힣0-9a-zA-Z .,!?]/g, " ").replace(/\s+/g, " ").trim();
      if (!clean) return;
      const u = new SpeechSynthesisUtterance(clean);
      u.lang = "ko-KR"; u.rate = .92; u.pitch = 1.25;
      speechSynthesis.speak(u);
    }catch(e){ /* 음성이 없는 기기도 있다 */ }
  }

  /* ══════════════════════════════════════════════════
     3. 게임 데이터
     ══════════════════════════════════════════════════ */

    chick:   { spr:"chick",   name:"병아리",      hp:16, dmg:1, hi:"삐약!" },

  const STAGES = [

  /* 지역마다 하늘과 땅이 바뀐다 — 전부 밝은 곳 */

    { n:"철",         c:"#B9B9B9", s:"#F0C8AC", gem:2, w:20 },
    { n:"금",         c:"#B9B9B9", s:"#FFC93C", gem:3, w:15 },
    { n:"다이아몬드", c:"#B9B9B9", s:"#4FE3D9", gem:5, w:12 },
    { n:"에메랄드",   c:"#B9B9B9", s:"#4FD46B", gem:4, w:7  }
  ];

  /* ══════════════════════════════════════════════════
     4. 상태
     ══════════════════════════════════════════════════ */
  const MAXHP = 20;
  const SAVE_KEY = "blockfriends.save.v1";

  let S = null;
  function freshState(){
    return { hp:MAXHP, gem:0, wep:0, food:2, stage:0, screen:"title",
             mob:null, mobMax:0, blocks:null, friends:[], cleared:false };
  }
  function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
  function load(){
    try{
      const d = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
      if (!d || typeof d.stage !== "number") return null;
      if (!Array.isArray(d.friends)) d.friends = [];
      return d;
    }catch(e){ return null; }
  }

  /* ══════════════════════════════════════════════════
     5. 화면
     ══════════════════════════════════════════════════ */
  const CW = 480, CH = 380, GY = 268;          /* 화면 크기와 땅 높이 */
  const BW = 110, BX0 = 50, BY0 = 67, BGAP = 135; /* 채굴 블록 배치 */

  /* 받침에 따라 조사를 골라 준다 — "아기 양를" 같은 말이 나오지 않도록 */
  function josa(word, withBatchim, without){
    const ch = String(word).replace(/[^가-힣]/g, "").slice(-1);
    if (!ch) return without;
    return ((ch.charCodeAt(0) - 0xAC00) % 28 !== 0) ? withBatchim : without;
  }

  const cv = document.getElementById("scene");
  const g  = cv.getContext("2d");
  g.imageSmoothingEnabled = false;

  const el = {
    hearts: document.getElementById("hearts"),
    gemN:   document.getElementById("gemN"),
    wepN:   document.getElementById("wepN"),
    foodN:  document.getElementById("foodN"),
    frdN:   document.getElementById("frdN"),
    bar:    document.getElementById("stagebar"),
    say:    document.getElementById("say"),
    acts:   document.getElementById("acts"),
    stage:  document.getElementById("stage"),
    flash:  document.getElementById("flash")
  };

  const HEART_FULL = '<svg class="heart" viewBox="0 0 8 8" aria-hidden="true"><g fill="#FF5C6E"><rect x="1" y="1" width="2" height="1"/><rect x="5" y="1" width="2" height="1"/><rect x="0" y="2" width="8" height="2"/><rect x="1" y="4" width="6" height="1"/><rect x="2" y="5" width="4" height="1"/><rect x="3" y="6" width="2" height="1"/></g><g fill="#FFD0D6"><rect x="1" y="2" width="1" height="1"/><rect x="5" y="2" width="1" height="1"/></g></svg>';
  const HEART_EMPTY = '<svg class="heart" viewBox="0 0 8 8" aria-hidden="true"><g fill="rgba(74,51,32,.28)"><rect x="1" y="1" width="2" height="1"/><rect x="5" y="1" width="2" height="1"/><rect x="0" y="2" width="8" height="2"/><rect x="1" y="4" width="6" height="1"/><rect x="2" y="5" width="4" height="1"/><rect x="3" y="6" width="2" height="1"/></g></svg>';

  function drawHUD(){
    const full = Math.ceil(S.hp / 2);
    let h = "";
    for (let i = 0; i < MAXHP / 2; i++) h += (i < full ? HEART_FULL : HEART_EMPTY);
    el.hearts.innerHTML = h;
    el.gemN.textContent  = S.gem;
    el.wepN.textContent  = WEAPONS[S.wep].name;
    el.foodN.textContent = S.food;
    el.frdN.textContent  = S.friends.length;

    let bars = "";
    for (let i = 0; i < STAGES.length; i++){
      bars += '<i class="' + (i < S.stage ? "on" : (i === S.stage ? "now" : "")) + '"></i>';
    }
    el.bar.innerHTML = bars;
  }

  /* 배경 */
  function drawWorld(areaName){
    const A = AREA[areaName] || AREA["꽃밭 마을"];
    const lg = g.createLinearGradient(0, 0, 0, GY);
    lg.addColorStop(0, A.sky[0]); lg.addColorStop(1, A.sky[1]);
    g.fillStyle = lg; g.fillRect(0, 0, CW, CH);

    /* 구름 */
    const t = Date.now() / 90;
    for (let i = 0; i < 3; i++){
      const cx = ((t * (0.25 + i * 0.1) + i * 190) % 620) - 90;
      const cy = 14 + i * 26;
      g.fillStyle = "rgba(255,255,255,.85)";
      g.fillRect(cx, cy, 66, 18);
      g.fillRect(cx + 16, cy - 12, 40, 14);
    }

    /* 땅 */
    for (let x = 0; x < CW; x += 40){
      drawBlock(g, x, GY,      40, A.top, null, x + 7);
      drawBlock(g, x, GY + 40, 40, A.sub, null, x + 91);
      drawBlock(g, x, GY + 80, 40, A.sub, null, x + 33);
    }

    /* 땅 위 장식 */
    for (let i = 0; i < 8; i++){
      const x = 18 + i * 58, y = GY - 15;
      if (A.deco === "flower"){
        g.fillStyle = i % 2 ? "#FF8FB1" : "#FFD54A";
        g.fillRect(x, y, 6, 6); g.fillRect(x - 5, y + 5, 6, 6); g.fillRect(x + 5, y + 5, 6, 6);
        g.fillStyle = "#4FA83A"; g.fillRect(x + 1, y + 11, 4, 6);
      } else if (A.deco === "leaf"){
        g.fillStyle = "#4FA83A"; g.fillRect(x - 4, y + 4, 14, 8); g.fillRect(x, y - 2, 6, 8);
      } else if (A.deco === "candy"){
        g.fillStyle = i % 2 ? "#FFF0F6" : "#FFC2DC";
        g.fillRect(x - 3, y + 2, 12, 12);
        g.fillStyle = "#FF7FB0"; g.fillRect(x, y + 5, 6, 6);
      } else {
        g.fillStyle = "#FFD54A";
        g.fillRect(x, y + 2, 5, 5); g.fillRect(x - 5, y + 7, 15, 5); g.fillRect(x, y + 12, 5, 5);
      }
    }
  }

  /* 반짝이 파티클 */
  let sparks = [];
  function burst(x, y, n, color){
    for (let i = 0; i < (n || 14); i++){
      sparks.push({ x:x, y:y, vx:(Math.random() - .5) * 7, vy:-Math.random() * 6 - 1,
                    life:34, c:color || (Math.random() > .5 ? "#FFD54A" : "#FFFFFF") });
    }
  }

  let wobT = 0, mobWhite = 0;

  function drawScene(){
    if (!S) return;
    const st = STAGES[Math.min(S.stage, STAGES.length - 1)];
    const areaName = st ? st.area : "무지개 성";

    g.save();
    if (wobT > 0) g.translate((Math.random() - .5) * 5, (Math.random() - .5) * 5);
    drawWorld(areaName);

    if (S.screen === "mine" && S.blocks){
      S.blocks.forEach((b, i) => {
        const x = BX0 + (i % 3) * BGAP, y = BY0 + Math.floor(i / 3) * BGAP;
        if (b.done){
          g.fillStyle = "rgba(255,255,255,.30)";
          g.fillRect(x, y, BW, BW);
        } else {
          const o = ORES[b.ore];
          drawBlock(g, x, y, BW, o.c, o.s, i * 977 + 13);
          if (b.hits > 0){
            g.strokeStyle = "rgba(74,51,32,.5)";
            g.lineWidth = 5;
            for (let k = 0; k <= b.hits; k++){
              g.beginPath();
              g.moveTo(x + 18 + k * 24, y + 10);
              g.lineTo(x + 44 + k * 20, y + BW - 10);
              g.stroke();
            }
          }
        }
      });
    } else {
      /* 주인공 */
      const hb = Math.sin(Date.now() / 420) * 3;
      drawSprite(g, "hero", 34, GY - 108 + hb, 9);
      drawSprite(g, "sword", 146, GY - 66 + hb, 7);

      /* 모은 친구들이 뒤따라온다 */
      S.friends.slice(-6).forEach((f, i) => {
        const m = MOBS[f];
        if (!m) return;
        const bb = Math.sin(Date.now() / 380 + i) * 2;
        drawSprite(g, m.spr, 16 + i * 26, GY + 46 + bb, 2);
      });

      /* 이번 친구 후보 */
      if (S.mob){
        const m = MOBS[S.mob.key];
        const s = m.boss ? 13 : 11;
        const w = SPR[m.spr].rows[0].length * s;
        const h = SPR[m.spr].rows.length * s;
        const bob = Math.sin(Date.now() / 300) * 6;
        drawSprite(g, m.spr, CW - w - 48, GY - h + bob, s, mobWhite > 0);

        const bw = 190, bx = CW - bw - 38, by = GY - h - 34;
        g.fillStyle = "#4A3320"; g.fillRect(bx - 4, by - 4, bw + 8, 24);
        g.fillStyle = "#FFF6E4"; g.fillRect(bx - 2, by - 2, bw + 4, 20);
        g.fillStyle = "#E4D6BE"; g.fillRect(bx, by, bw, 16);
        const p = Math.max(0, S.mob.hp) / S.mobMax;
        g.fillStyle = "#FF8FB1"; g.fillRect(bx, by, bw * p, 16);
        g.fillStyle = "rgba(255,255,255,.55)"; g.fillRect(bx, by, bw * p, 5);
      }
    }

    /* 반짝이 */
    sparks = sparks.filter(s => s.life > 0);
    sparks.forEach(s => {
      s.x += s.vx; s.y += s.vy; s.vy += .32; s.life--;
      g.fillStyle = s.c;
      g.globalAlpha = Math.max(0, s.life / 34);
      g.fillRect(s.x, s.y, 6, 6);
      g.globalAlpha = 1;
    });

    g.restore();
    if (wobT > 0) wobT--;
    if (mobWhite > 0) mobWhite--;
  }
  /* ══════════════════════════════════════════════════
     6. 말하기 · 버튼
     ══════════════════════════════════════════════════ */
  function say(main, sub){
    el.say.innerHTML = main + (sub ? "<small>" + sub + "</small>" : "");
    el.say.classList.remove("pop");
    void el.say.offsetWidth;
    el.say.classList.add("pop");
    speak(main);
  }

  function acts(list){
    el.acts.innerHTML = "";
    list.forEach(a => {
      const b = document.createElement("button");
      b.textContent = a.t;
      if (a.cls) b.className = a.cls;
      if (a.off) b.disabled = true;
      b.addEventListener("click", () => { if (!b.disabled) a.on(); });
      el.acts.appendChild(b);
    });
  }

  /* ══════════════════════════════════════════════════
     7. 흐름
     ══════════════════════════════════════════════════ */
  function checkWeapon(){
    let up = false;
    while (S.wep < WEAPONS.length - 1 && S.gem >= WEAPONS[S.wep + 1].gem){ S.wep++; up = true; }
    return up;
  }

  function title(){
    S.screen = "title"; S.mob = null; S.blocks = null;
    drawHUD();
    const saved = load();
    const canResume = saved && saved.stage > 0 && !saved.cleared;
    say("🌸 블록 친구들의 모험", "친구를 만나고 보석을 모아요!");
    const list = [{ t:"▶️ 시작하기", cls:"go", on:() => { S = freshState(); save(); nextStage(); } }];
    if (canResume){
      list.unshift({ t:"⏩ 이어 하기", cls:"go", on:() => { S = saved; nextStage(); } });
      list[1].t = "🆕 새로 하기";
      list[1].cls = "";
    }
    acts(list);
  }

  function nextStage(){
    if (S.stage >= STAGES.length){ clearGame(); return; }
    save(); drawHUD();
    const st = STAGES[S.stage];
    S.mob = null; S.blocks = null; S.screen = "walk";
    say(st.area + " · " + (S.stage + 1) + "번째 길", "다음으로 가 볼까요?");
    acts([{ t:"➡️ 출발!", cls:"go", on:startStage }]);
  }

  function startStage(){
    const st = STAGES[S.stage];
    if (st.kind === "fight") startFight(st.mob);
    else if (st.kind === "mine") startMine();
    else startChest();
  }

  /* ── 친구 만나기 ──────────────────────────────────── */
  function startFight(key){
    const m = MOBS[key];
    S.screen = "fight";
    S.mob = { key:key, hp:m.hp };
    S.mobMax = m.hp;
    SFX.tap();
    say(m.name + josa(m.name, "을", "를") + " 만났어요! " + m.hi,
        m.boss ? "마지막 친구예요! 힘내요! 🌈" : "톡톡 놀아 주면 친구가 돼요!");
    fightActs();
    drawHUD();
  }

  function fightActs(){
    acts([
      { t:"✨ 톡! 놀아주기", cls:"hit", on:attack },
      { t:"🍎 밥 먹기 (" + S.food + ")", cls:"eat", off:(S.food <= 0 || S.hp >= MAXHP), on:eat }
    ]);
  }

  function attack(){
    const m = MOBS[S.mob.key];
    const w = WEAPONS[S.wep];
    const big = Math.random() < .28;
    let d = w.dmg + Math.floor(Math.random() * 3);
    if (big) d *= 2;
    S.mob.hp -= d;
    mobWhite = 7;
    burst(365, GY - 80, big ? 18 : 8, big ? "#FFD54A" : "#FFFFFF");
    big ? SFX.great() : SFX.tap();

    if (S.mob.hp <= 0){ winFight(); return; }

    /* 되받아치기 — 자주 빗나가서 아주 순하다 */
    if (Math.random() < .4){
      say(big ? "우와! 반짝 " + d + "!" : "톡! " + d + "!", m.name + josa(m.name, "이", "가") + " 폴짝 피했어요!");
    } else {
      const dd = Math.max(1, m.dmg);
      S.hp -= dd;
      SFX.bump();
      wobT = 10;
      el.flash.classList.remove("on"); void el.flash.offsetWidth; el.flash.classList.add("on");
      if (S.hp <= 0){ rest(); return; }
      say(big ? "우와! 반짝 " + d + "!" : "톡! " + d + "!", m.name + josa(m.name, "이", "가") + " 콩! 하고 부딪혔어요.");
    }
    drawHUD(); fightActs(); save();
  }

  function eat(){
    if (S.food <= 0) return;
    S.food--;
    S.hp = Math.min(MAXHP, S.hp + 8);
    SFX.eat();
    burst(110, GY - 80, 10, "#FF8FB1");
    say("🍎 냠냠! 맛있어요!", "하트가 채워졌어요!");
    drawHUD(); fightActs(); save();
  }

  /* 지지 않는 게임 — 잠깐 쉬고 다시 */
  function rest(){
    S.hp = MAXHP;
    if (S.mob) S.mob.hp = Math.max(4, Math.ceil(S.mob.hp / 2));
    SFX.up();
    burst(240, GY - 90, 16, "#FF8FB1");
    drawHUD();
    say("잠깐 쉬었어요! 😊", "하트를 가득 채워 줄게요. 다시 해봐요!");
    acts([{ t:"✨ 다시 놀아주기", cls:"hit", on:() => { say("좋아요! 톡톡!", ""); fightActs(); } }]);
    save();
  }

  function winFight(){
    const m = MOBS[S.mob.key];
    const key = S.mob.key;
    const got = m.boss ? 12 : 2 + Math.floor(Math.random() * 3);
    S.gem += got;
    if (S.friends.indexOf(key) === -1) S.friends.push(key);
    S.mob = null;
    SFX.win();
    burst(365, GY - 90, 26, "#FFD54A");
    const up = checkWeapon();
    drawHUD();

    if (m.boss){
      say("🌈 무지개 드래곤과 친구가 됐어요!", "정말 정말 잘했어요!");
      acts([{ t:"🎉 다음으로", cls:"go", on:() => { S.stage++; clearGame(); } }]);
      save();
      return;
    }
    if (up){
      SFX.up();
      say(m.name + josa(m.name, "과", "와") + " 친구가 됐어요! 🎉", "보석 " + got + "개! 새 무기 ✨ " + WEAPONS[S.wep].name + " ✨");
    } else {
      say(m.name + josa(m.name, "과", "와") + " 친구가 됐어요! 🎉", "보석 " + got + "개를 받았어요!");
    }
    acts([{ t:"➡️ 다음으로", cls:"go", on:() => { S.stage++; nextStage(); } }]);
    save();
  }

  /* ── 블록 캐기 ────────────────────────────────────── */
  function pickOre(){
    const total = ORES.reduce((a, o) => a + o.w, 0);
    let r = Math.random() * total;
    for (let i = 0; i < ORES.length; i++){ r -= ORES[i].w; if (r <= 0) return i; }
    return 0;
  }

  function startMine(){
    S.screen = "mine";
    S.blocks = [];
    for (let i = 0; i < 6; i++) S.blocks.push({ ore:pickOre(), hits:0, done:false });
    say("⛏️ 블록을 캐요!", "블록을 두 번씩 눌러 보세요!");
    acts([{ t:"⛏️ 블록을 눌러요", off:true, on:function(){} }]);
    drawHUD();
  }

  function mineClick(ev){
    if (S.screen !== "mine" || !S.blocks) return;
    const r = cv.getBoundingClientRect();
    const x = (ev.clientX - r.left) * (CW / r.width);
    const y = (ev.clientY - r.top)  * (CH / r.height);

    for (let i = 0; i < 6; i++){
      const bx = BX0 + (i % 3) * BGAP, by = BY0 + Math.floor(i / 3) * BGAP;
      if (x >= bx && x <= bx + BW && y >= by && y <= by + BW){
        const b = S.blocks[i];
        if (b.done) return;
        b.hits++;
        SFX.mine();
        wobT = 3;
        if (b.hits >= 2){
          b.done = true;
          const o = ORES[b.ore];
          S.gem += o.gem;
          burst(bx + BW / 2, by + BW / 2, o.gem >= 4 ? 20 : 10, o.s || "#FFFFFF");
          if (o.gem >= 4) SFX.gem();
          const up = checkWeapon();
          drawHUD();
          if (up){
            SFX.up();
            say(o.n + "! 💎", "새 무기 ✨ " + WEAPONS[S.wep].name + " ✨");
          } else if (o.gem === 0){
            say(o.n + josa(o.n, "을", "를") + " 캤어요!", "다음 블록도 캐 봐요!");
          } else {
            say(o.n + josa(o.n, "을", "를") + " 캤어요! 💎", "보석 " + o.gem + "개를 받았어요!");
          }
          if (S.blocks.every(v => v.done)){
            SFX.win();
            say("블록을 다 캤어요! 🎉", "다음으로 가요!");
            acts([{ t:"➡️ 다음으로", cls:"go", on:() => { S.stage++; nextStage(); } }]);
          }
        }
        save();
        return;
      }
    }
  }
  cv.addEventListener("click", mineClick);

  /* ── 선물 상자 ────────────────────────────────────── */
  function startChest(){
    S.screen = "chest";
    say("🎁 선물 상자를 찾았어요!", "열어 볼까요?");
    acts([{ t:"🎁 상자 열기!", cls:"go", on:() => {
      const food = 2 + Math.floor(Math.random() * 2);
      const gem  = 3 + Math.floor(Math.random() * 4);
      S.food += food; S.gem += gem;
      SFX.gem();
      burst(240, GY - 90, 24, "#FFD54A");
      const up = checkWeapon();
      drawHUD();
      say("우와! 🎉", "밥 " + food + "개, 보석 " + gem + "개!" + (up ? " 새 무기 ✨ " + WEAPONS[S.wep].name + " ✨" : ""));
      if (up) SFX.up();
      acts([{ t:"➡️ 다음으로", cls:"go", on:() => { S.stage++; nextStage(); } }]);
      save();
    }}]);
    drawHUD();
  }

  /* ── 끝 ───────────────────────────────────────────── */
  function clearGame(){
    S.screen = "clear"; S.cleared = true; S.mob = null;
    SFX.win();
    burst(240, GY - 100, 40, "#FFD54A");
    setTimeout(() => burst(150, GY - 90, 30, "#FF8FB1"), 260);
    setTimeout(() => burst(340, GY - 90, 30, "#4FE3D9"), 480);
    drawHUD();
    say("🏆 모험 끝! 최고예요!",
        "친구 " + S.friends.length + "명 · 보석 " + S.gem + "개 · " + WEAPONS[S.wep].name + "까지 만들었어요!");
    acts([{ t:"🔄 다시 하기", cls:"go", on:() => { S = freshState(); save(); title(); } }]);
    save();
  }

  /* ══════════════════════════════════════════════════
     8. 도구 버튼
     ══════════════════════════════════════════════════ */
  const bV = document.getElementById("btnVoice");
  const bS = document.getElementById("btnSound");
  bV.addEventListener("click", () => {
    cfg.voice = !cfg.voice;
    bV.setAttribute("aria-pressed", String(cfg.voice));
    if (!cfg.voice && "speechSynthesis" in window) speechSynthesis.cancel();
    else speak("읽어 줄게요");
  });
  bS.addEventListener("click", () => {
    cfg.sound = !cfg.sound;
    bS.setAttribute("aria-pressed", String(cfg.sound));
    if (cfg.sound) SFX.up();
  });
  document.getElementById("btnReset").addEventListener("click", () => {
    S = freshState();
    try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
    title();
  });

  S = freshState();
  title();
  (function loop(){ drawScene(); requestAnimationFrame(loop); })();

  /* 테스트용 */
  window.__BF = { get S(){ return S; }, set S(v){ S = v; },
                  attack, nextStage, startStage, mineClick, STAGES, MOBS, WEAPONS, acts };
})();
</script>

</body>
</html>
